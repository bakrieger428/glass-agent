plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bakrieger.sidekick'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bakrieger.sidekick'
        minSdk 21
        targetSdk 33
        versionCode 9
        versionName '0.2.1'
    }

    signingConfigs {
        sidekick {
            storeFile rootProject.file('keystore/sidekick.p12')
            storePassword 'sidekick2026'
            keyAlias 'sidekick'
            keyPassword 'sidekick2026'
            storeType 'PKCS12'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sidekick
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sidekick
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // intentionally empty — zero external dependencies for build reliability
}
