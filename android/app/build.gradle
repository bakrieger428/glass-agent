plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bakrieger.sidekick'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bakrieger.sidekick'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // intentionally empty — zero external dependencies for build reliability
}
