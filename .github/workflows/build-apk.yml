name: Build Sidekick APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleRelease --no-daemon
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Sidekick.apk

      - name: Diagnose APK vs known-good
        run: |
          ls "$ANDROID_HOME/build-tools" || true
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "=== OUR APK badging ==="
          "$BT/aapt" dump badging Sidekick.apk | head -25
          echo "=== OUR APK signature ==="
          "$BT/apksigner" verify --verbose Sidekick.apk | head -18 || true
          curl -sL https://github.com/eung3392/eungsoft/releases/download/RokidGlassesApp/EKTimer_v1.0.0.apk -o ektimer.apk
          echo "=== EK TIMER badging (known-good) ==="
          "$BT/aapt" dump badging ektimer.apk | head -25
          echo "=== EK TIMER signature ==="
          "$BT/apksigner" verify --verbose ektimer.apk | head -18 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sidekick-apk
          path: Sidekick.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Sidekick latest build"
          body: "Auto-built from the latest push. Install via Hi Rokid → Toolbox → Install Local App."
          files: Sidekick.apk
